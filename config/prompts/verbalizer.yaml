# Spoken forms for the digit verbalizer (C8 step 2). Amounts and dates go to Timbre as words, never as digits (V-assumption in docs/PHASE0.md).
# numerals: value -> spoken word (hi has every value 0-99; ta has 0-19 and the tens, 21-99 are tens + unit); hundreds: ta only, 200-900.
# scales: 100 / 1000 / 100000 / 10000000. confusable: number pairs that sound alike on a phone line; an amount that contains one is echoed digit by digit.
confusable: [[13, 30], [14, 40], [15, 50], [16, 60], [17, 70], [18, 80], [19, 90], [35, 45]]
months: [january, february, march, april, may, june, july, august, september, october, november, december]
