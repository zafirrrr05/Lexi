    24: chaubis, 25: pachchis, 26: chhabbis, 27: sattaais, 28: atthaais, 29: untis, 30: tees, 31: ikattis,
    32: battis, 33: taintis, 34: chauntis, 35: paintees, 36: chhattis, 37: saintis, 38: adtis, 39: untalis,
    40: chalis, 41: iktalis, 42: bayalis, 43: taintalis, 44: chauvalis, 45: paintalis, 46: chhiyalis, 47: saintalis,
    48: adtalis, 49: unchas, 50: pachas, 51: ikyavan, 52: bavan, 53: tirpan, 54: chauvan, 55: pachpan,
