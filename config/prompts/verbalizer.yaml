    16: pathinaaru, 17: pathinezhu, 18: pathinettu, 19: pathonbadhu, 20: irubadhu, 30: muppadhu, 40: naarpadhu, 50: aimbadhu,
    60: arubadhu, 70: ezhubadhu, 80: enbadhu, 90: thonnooru,
  }
