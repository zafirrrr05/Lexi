  numerals: {
    0: shunya, 1: ek, 2: do, 3: teen, 4: chaar, 5: paanch, 6: chhah, 7: saat,
    8: aath, 9: nau, 10: das, 11: gyarah, 12: barah, 13: terah, 14: chaudah, 15: pandrah,
